[project]
name = "animeway"
version = "0.10.0"
description = "Anime pilgrimage retrieval and route-planning assistant"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "geopy>=2.4,<3",
    "dashscope>=1.14,<2",
    "pillow>=10,<13",
    "pydantic>=2,<3",
    "pydeck>=0.8,<1",
    "requests>=2.31,<3",
    "streamlit>=1.60,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "ruff>=0.9,<1",
    "types-requests>=2.31,<3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "knowledge_base",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = [
    "core/trip_adoption.py",
    "core/trip_transport.py",
]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"
no_implicit_optional = true
show_error_codes = true
