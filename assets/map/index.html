<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeWay map</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#173145}#map{position:relative;height:410px;width:100%;overflow:hidden;background:#e4edf0;border:1px solid #aac1cd;border-radius:12px;touch-action:none;cursor:grab}#map:focus-visible{outline:3px solid #077d9f;outline-offset:-3px}#map.dragging{cursor:grabbing}.tile{position:absolute;width:256px;height:256px;user-select:none;pointer-events:none}.pin{position:absolute;transform:translate(-50%,-50%);border:2px solid white;border-radius:50%;width:18px;height:18px;background:#5865c7;color:white;cursor:pointer;box-shadow:0 1px 5px #3348;padding:0}.pin.selected{z-index:2;outline:4px solid #f5b23d;width:23px;height:23px}.pin.saved{border:3px solid #1ccbb2}.pin.closed.closed{background:#6b7280}.pin.selection,.pin.route{background:#007aa3}.cluster{min-width:34px;width:auto;height:34px;padding:0 7px;background:#254f66;font-weight:700}.controls{position:absolute;left:10px;top:10px;display:grid;gap:4px;z-index:5}.controls button{font-size:22px;width:38px;height:38px;border:1px solid #89a4b4;border-radius:6px;background:white;color:#173145;cursor:pointer}#notice{position:absolute;top:10px;right:10px;max-width:70%;padding:6px 9px;background:#fffef0e8;border-radius:5px;pointer-events:none;z-index:4}#credit{position:absolute;bottom:0;right:0;background:#fffd;font-size:11px;padding:3px 6px;z-index:5}#credit a{color:#205271}.pin:focus-visible{outline:4px solid #fc0}.help{font-size:12px;color:#526974;margin:5px 0}@media(max-width:500px){#map{height:340px}.pin{width:22px;height:22px}}
</style></head><body><div id="map" role="application" tabindex="0" aria-label="Interactive pilgrimage map"><div id="tiles"></div><div id="pins"></div><div class="controls"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button></div><div id="notice" role="status"></div><div id="credit">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div></div><div class="help" id="help"></div><script src="map.js"></script></body></html>
