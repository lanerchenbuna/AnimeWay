name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check configured modules
        run: uv run mypy

      - name: Compile application modules
        run: uv run python -m compileall -q app.py assets components core data_factory scripts utils tests

      - name: Run transport and Trip acceptance tests
        run: uv run python -m unittest discover -s tests -v

      - name: Parse browser scripts
        run: |
          node --check assets/identity/identity.js
          node --check assets/map/map.js

      - name: Build an offline public snapshot
        run: uv run python -m data_factory.release --root "$RUNNER_TEMP/animeway-public-snapshots" --offline
